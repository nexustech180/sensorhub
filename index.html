<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gold Var Sensor Hub</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<h1>Gold Var Sensor Hub</h1>

<h2>Camera</h2>
<div id="camera">
  <canvas id="cam-canvas" width="640" height="360" hidden></canvas>
  <img id="cam-img" alt="Camera picture" hidden>
  <p id="cam-msg" hidden></p>
</div>
<p id="cam-status"></p>

<h2>Sensors</h2>
<p id="mcu-status"></p>
<table>
  <thead><tr><th>Sensor</th><th>Value</th><th>Status</th></tr></thead>
  <tbody id="readings"><tr><td colspan="3">Waiting for data…</td></tr></tbody>
</table>

<h2>Settings</h2>
<form id="settings" onsubmit="return false">
  <p><label><input type="checkbox" id="s-demo"> Demo mode (simulated readings and camera)</label></p>
  <p><label>Sensor board IP<br><input type="text" id="s-mcuIp" placeholder="192.168.1.50" autocomplete="off"></label></p>
  <p><label>Camera IP<br><input type="text" id="s-camIp" placeholder="192.168.1.60" autocomplete="off"></label></p>
</form>

<script src="js/classifier.js"></script>
<script src="js/demo.js"></script>
<script src="js/app.js"></script>
</body>
</html>
