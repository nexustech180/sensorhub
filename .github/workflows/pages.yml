name: Publish homepage

# Publishes https://nexustech180.github.io/sensorhub/
#   /      -> site/index.html (download page with all links)
#   /app/  -> the dashboard as a web demo (no AI key: js/ai-config.js stays empty)
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Build and deploy are separate jobs (GitHub's recommended layout): deploying in the same job,
  # seconds after the upload, sometimes failed with "No artifacts named github-pages were found"
  # because the upload wasn't registered yet.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Assemble the site
        run: |
          mkdir -p _site/app _site/firmware
          cp -r site/. _site/
          cp -r index.html css js _site/app/
          cp firmware/esp8266_wifi_gateway/esp8266_wifi_gateway.ino _site/firmware/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
