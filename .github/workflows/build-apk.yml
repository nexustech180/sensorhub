name: Build Android APK

# Builds the Android app from the dashboard (index.html, css/, js/) with Capacitor.
# - Every push to main / android-apk: the APK is attached to the workflow run (Artifacts).
# - Pushing a tag like v0.1.0: the APK is also published on a GitHub Release.
on:
  push:
    branches: [main, android-apk]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # needed to create the Release on tag pushes

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: npm install

      - name: Copy the dashboard into www/
        run: npm run web

      - name: Insert the Gemini key from the repository secret (if set)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            node -e "const fs=require('fs');const f='www/js/ai-config.js';const s=fs.readFileSync(f,'utf8');const out=s.replace(/const GEMINI_API_KEY = '[^']*';/, 'const GEMINI_API_KEY = ' + JSON.stringify(process.env.GEMINI_API_KEY) + ';');if(out===s)throw new Error('key line not found');fs.writeFileSync(f,out);"
            echo "AI helper key inserted."
          else
            echo "No GEMINI_API_KEY secret: building without the AI helper."
          fi

      - name: Create the Android project
        run: npx cap add android

      - name: Allow plain HTTP to the ESP32 on the local network
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'usesCleartextTraffic' "$M" || sed -i 's/<application\b/<application android:usesCleartextTraffic="true"/' "$M"
          grep -q 'usesCleartextTraffic="true"' "$M"
          echo "Cleartext HTTP enabled in $M"

      - name: Sync web files and settings
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk GoldVarSensorHub.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GoldVarSensorHub-apk
          path: GoldVarSensorHub.apk

      - name: Publish on a GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: GoldVarSensorHub.apk
          body: |
            Gold Var Sensor Hub for Android.
            Install: download GoldVarSensorHub.apk on the phone, open it and allow "Install unknown apps" when asked.
            Connect the phone to the same WiFi or hotspot as the ESP32, then enter the IP shown on the Mega's LCD in Settings.
