name: Build apps

# Builds Gold Var Sensor Hub for Android (.apk, Capacitor) and Windows (.exe, Electron)
# from the same dashboard (index.html, css/, js/).
# - Every push to main / android-apk: both files are attached to the workflow run (Artifacts).
# - Pushing a tag like v0.1.0: both files are also published on a GitHub Release.
# The Gemini key comes from the repository secret GEMINI_API_KEY (js/ai-config.js stays empty in the code).
on:
  push:
    branches: [main, android-apk]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # needed to create the Release on tag pushes

jobs:
  apk:
    name: Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install Capacitor
        run: npm install

      - name: Copy the dashboard into www/
        run: npm run web

      - name: Insert the Gemini key (repository secret)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/insert-key.js www

      - name: Create the Android project
        run: npx cap add android

      - name: Allow plain HTTP to the ESP32 on the local network
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'usesCleartextTraffic' "$M" || sed -i 's/<application\b/<application android:usesCleartextTraffic="true"/' "$M"
          grep -q 'usesCleartextTraffic="true"' "$M"
          echo "Cleartext HTTP enabled in $M"

      - name: Sync web files and settings
        run: npx cap sync android

      - name: Set the app version (must rise with every build so Android accepts it as an update)
        run: |
          F=android/app/build.gradle
          V=$(node -p "require('./package.json').version")
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"$V\"/" "$F"
          grep -q "versionCode ${{ github.run_number }}" "$F"
          grep -q "versionName \"$V\"" "$F"
          echo "versionCode = ${{ github.run_number }}, versionName = $V"

      - name: Build APK (unsigned release)
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      # The signing key is committed on purpose (android-signing/): this is a hobby project, so every
      # build uses the same key and installs as an in-place update. Anyone with the repo could sign an
      # APK with it, so don't reuse this key for anything that matters.
      - name: Sign the APK with the project key
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          UNSIGNED=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks android-signing/goldvar-release.jks --ks-key-alias goldvar \
            --ks-pass pass:goldvar-steam --key-pass pass:goldvar-steam \
            --out GoldVarSensorHub.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs GoldVarSensorHub.apk | grep -i 'SHA-256'

      - uses: actions/upload-artifact@v7
        with:
          name: GoldVarSensorHub-apk
          path: GoldVarSensorHub.apk

  exe:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Copy the dashboard into desktop/www/
        shell: bash
        run: |
          npm run web
          rm -rf desktop/www
          cp -r www desktop/www

      - name: Insert the Gemini key (repository secret)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/insert-key.js desktop/www

      - name: Install Electron
        working-directory: desktop
        run: npm install

      - name: Build EXE (64-bit)
        working-directory: desktop
        shell: bash   # PowerShell splits "-c.x.y=z" options apart
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'   # not code-signed
        run: npx electron-builder --win portable --x64 --publish never --config.win.artifactName=GoldVarSensorHub-64bit.exe --config.directories.output=dist/x64

      # Electron 44+ has no 32-bit Windows build; 43 is the newest line that still does.
      - name: Build EXE (32-bit, Electron 43)
        working-directory: desktop
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          V=$(npm view "electron@^43" version --json | node -e "console.log([].concat(JSON.parse(require('fs').readFileSync(0,'utf8'))).pop())")
          echo "32-bit build uses Electron $V"
          npx electron-builder --win portable --ia32 --publish never --config.electronVersion="$V" --config.win.artifactName=GoldVarSensorHub-32bit.exe --config.directories.output=dist/ia32

      - uses: actions/upload-artifact@v7
        with:
          name: GoldVarSensorHub-exe
          path: |
            desktop/dist/x64/GoldVarSensorHub-64bit.exe
            desktop/dist/ia32/GoldVarSensorHub-32bit.exe
          if-no-files-found: error

  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [apk, exe]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - uses: softprops/action-gh-release@v3
        with:
          fail_on_unmatched_files: true
          files: |
            GoldVarSensorHub.apk
            GoldVarSensorHub-64bit.exe
            GoldVarSensorHub-32bit.exe
          body: |
            Gold Var Sensor Hub - dashboard for the GOLD-VAR illegal-mining detection system.

            **Android:** download `GoldVarSensorHub.apk` on the phone, open it and allow "Install unknown apps" when asked. One file works on both 32-bit and 64-bit phones.
            **Windows:** download `GoldVarSensorHub-64bit.exe` (almost all PCs), or `GoldVarSensorHub-32bit.exe` for 32-bit Windows. Run it; no installation needed. If Windows SmartScreen warns, click "More info" → "Run anyway" (the app isn't code-signed).
            To check: Windows Settings → System → About → System type.

            Connect the phone or PC to the same WiFi or hotspot as the ESP32, turn Demo mode off in Settings and enter the IP shown on the Mega's LCD (page 4).
